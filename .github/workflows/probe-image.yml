name: Probe hidden-ref image

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  write:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Commit the crop to a hidden ref and comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          content=$(base64 -w0 .probe/crop.png)
          blob=$(gh api "repos/$REPO/git/blobs" -f encoding=base64 -f content="$content" --jq .sha)
          tree=$(gh api "repos/$REPO/git/trees" -f 'tree[][path]=crop-'"$GITHUB_RUN_ID"'.png' -f 'tree[][mode]=100644' -f 'tree[][type]=blob' -f "tree[][sha]=$blob" --jq .sha)
          commit=$(gh api "repos/$REPO/git/commits" -f message="Observed evidence for #$PR, run $GITHUB_RUN_ID" -f tree="$tree" --jq .sha)
          ref="refs/observed/evidence/pr-$PR"
          if gh api "repos/$REPO/git/ref/observed/evidence/pr-$PR" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/observed/evidence/pr-$PR" -f sha="$commit" -F force=true
          else
            gh api "repos/$REPO/git/refs" -f ref="$ref" -f sha="$commit"
          fi
          file="crop-$GITHUB_RUN_ID.png"
          body=$(printf 'probe: hidden ref `%s` at `%s`\n\ngithub.com raw:\n\n![github raw](https://github.com/%s/raw/%s/%s)\n\nraw.githubusercontent.com:\n\n![raw host](https://raw.githubusercontent.com/%s/%s/%s)\n' "$ref" "$commit" "$REPO" "$commit" "$file" "$REPO" "$commit" "$file")
          gh api "repos/$REPO/issues/$PR/comments" -f body="$body" --jq .html_url

  read-only:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    # The token a fork pull request gets: no contents write.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Try the same writes with a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          gh api "repos/$REPO/git/blobs" -f encoding=base64 -f content=aGk= -i 2>&1 | head -20 || true

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Delete the hidden ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/git/refs/observed/evidence/pr-$PR" -i | head -5
