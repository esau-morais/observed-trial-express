name: Observed

on:
  pull_request:

permissions:
  contents: write
  checks: write
  pull-requests: write

env:
  OBSERVED_FROM_SOURCE: "true"
  DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: esau-morais/observed@36e4821b678bfb5c4e15b1bb38a37671c58fbf68
        with:
          project: .
          base: ${{ github.event.pull_request.base.sha }}
          candidate: ${{ github.event.pull_request.head.sha }}
