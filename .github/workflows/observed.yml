name: Observed

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: observed-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # UX pass 2026-10-03: the feat/comment-shows-evidence build of Observed.
      - uses: esau-morais/observed@3c55ca577eaa7eaec3f9af83a2213b3f32705d54
        env:
          OBSERVED_FROM_SOURCE: true
        with:
          project: request-lab
          base: ${{ github.event.pull_request.base.sha }}
          # Checks that GitHub refuses the image upload for the workflow token.
          image-upload-token: ${{ github.token }}
