name: Observed

on:
  pull_request:

permissions:
  contents: write
  checks: write
  pull-requests: write

concurrency:
  group: observed-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Session I 2026-10-05: the Discord delivery build of Observed.
      - uses: esau-morais/observed@f149da352f61472eece47b911c405a174117b321
        env:
          OBSERVED_FROM_SOURCE: true
        with:
          project: request-lab
          base: ${{ github.event.pull_request.base.sha }}
          discord-bot-token: ${{ secrets.OBSERVED_DISCORD_BOT_TOKEN }}
          discord-channel: ${{ vars.OBSERVED_DISCORD_CHANNEL }}
          discord-images: 'true'
