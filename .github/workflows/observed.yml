name: Observed

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: observed-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: esau-morais/observed@e160172d284ecd7ecde0a7698679c871caeaabfa
        env:
          OBSERVED_FROM_SOURCE: true
        with:
          project: gate-corpus
          base: ${{ github.event.pull_request.base.sha }}
