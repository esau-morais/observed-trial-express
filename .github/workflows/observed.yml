name: Observed

on:
  pull_request:

permissions:
  contents: write
  checks: write
  pull-requests: write

concurrency:
  group: observed-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Session H 2026-10-05: the feat/scene-gif build of Observed.
      - uses: esau-morais/observed@7d9d120bb91284e7b334e9b63b871f5613a94943
        env:
          OBSERVED_FROM_SOURCE: true
        with:
          project: request-lab
          base: ${{ github.event.pull_request.base.sha }}
