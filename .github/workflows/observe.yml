name: Observe generated input
on:
  pull_request:
permissions:
  contents: write
  checks: write
  pull-requests: write
jobs:
  generated-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: esau-morais/observed@53d6a91572439e2fe9cf1f5405c1e3fcb8051017
        env:
          OBSERVED_FROM_SOURCE: true
        with:
          project: examples/request-lab
          base: ${{ github.event.pull_request.base.sha }}
          generated: generated journeys.json
          artifact-name: generated-input
